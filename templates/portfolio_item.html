<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{title}}</title>
  <link rel="stylesheet" href="/assets/main.css">
</head>
<body>
  <h1>Project</h1>
  {% for item %}
    <article class="portfolio-item">
      <h2>{{title}}</h2>
      <p class="muted tags">{{tags}}</p>
      <p class="desc">{{longDesc}}</p>
      <div class="portfolio-images">
        {% for images %}
          <img src="{{value}}" alt="Project image" class="portfolio-image">
        {% endfor %}
      </div>
      <div class="links">
        <!-- <a class="btn" href="{{link}}">Source</a> -->
      </div>
    </article>
  {% endfor %}
  <p><a href="/portfolio">Back</a></p>
</body>
</html>
